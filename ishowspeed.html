<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>喵</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="light">
    <header class="header">
      <h1 class="title"><a href="/" class="cursor-pointer">喵</a></h1>
    </header>
    <nav class="toolbar">
      <button class="cursor-pointer sidebar-btn" id="sidebarToggle">☰ 侧边栏</button>
    </nav>
    <div id="sidebarMask" class="sidebarMask"></div>
    <aside class="sidebar" id="sidebar">
      <ul>
        <li class="sidebar-word"><a href="/" class="cursor-pointer">主页</a></li>
        <li class="sidebar-word"><a href="/from-sidebar/about.html" class="cursor-pointer">关于我</a></li>
        <li class="sidebar-word"><a href="/from-sidebar/contact.html" class="cursor-pointer">联系</a></li>
        <li class="sidebar-word"><a href="/ishowspeed.html" class="cursor-pointer">测速</a></li>
        <li class="sidebar-word"><a href="https://status.zccu.qzz.io" class="cursor-pointer">状态</a></li>
        <li class="sidebar-word"><a href="internal-server-error.html" class="cursor-pointer">搞抽象</a></li>
      </ul>
    </aside>
    <main class="content">
      <article class="post">
        <h2 class="post-title">开始测试</h2>
        <div class="post-content">
          <h4>测速说明：</h4>
        <ul>
          <li>延迟测试：通过多次请求计算平均响应时间</li>
          <li>下载速度：测试从服务器下载数据的速度</li>
          <li>结果仅供参考，实际速度受多种因素影响</li>
          <li>建议在网络稳定时进行测试以获得准确结果</li>
          <li>不是很准</li>
        </ul>
        <button class="read-more-btn cursor-pointer" id="startBtn" onclick="startTest()">
        开始测速
      </button>
      <div class="status-text" id="statusText"></div>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">准备测试...</div>
      </div>
      <div class="results" id="results">
        <div class="result-card">
          <h3>延迟 (Ping)</h3>
          <div>
            <span class="result-value" id="latencyValue">0</span>
            <span class="result-unit">ms</span>
          </div>
        </div>
        <div class="result-card">
          <h3>下载速度</h3>
          <div>
            <span class="result-value" id="downloadValue">0</span>
            <span class="result-unit">Mbps</span>
          </div>
        </div>
        <br />
        <div class="timestamp" id="timestamp"></div>
      </div>
      </article>
    </main>
    <script src="/sidebar.js"></script>
    <!--ai写的,差距太坤八大了,todo:重写/废了他-->
    <script>
let testing = false;

// 辅助函数：格式化速度
const formatMbps = (bytesPerSecond) => ((bytesPerSecond * 8) / (1024 * 1024)).toFixed(2);

async function startTest() {
    if (testing) return;
    testing = true;

    const ui = {
        btn: document.getElementById('startBtn'),
        progress: document.getElementById('progressContainer'),
        fill: document.getElementById('progressFill'),
        status: document.getElementById('statusText'),
        res: document.getElementById('results'),
        latency: document.getElementById('latencyValue'),
        download: document.getElementById('downloadValue')
    };

    ui.btn.disabled = true;
    ui.btn.textContent = '测试中...';
    ui.res.style.display = 'none';
    ui.progress.style.display = 'block';

    try {
        // --- 阶段 1: 延迟测试 (Ping) ---
        ui.status.textContent = '正在探测服务器响应延迟...';
        let pings = [];
        for (let i = 0; i < 6; i++) {
            const start = performance.now();
            // 使用 HEAD 请求减小流量消耗，Cache-Buster 防止缓存
            await fetch(`${window.location.origin}/?t=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
            pings.push(performance.now() - start);
            ui.fill.style.width = `${(i + 1) * 5}%`; // 0-30%
            await new Promise(r => setTimeout(r, 100));
        }
        const avgLatency = Math.min(...pings); // 取最小值作为有效延迟
        ui.latency.textContent = avgLatency.toFixed(1);

        // --- 阶段 2: 下载速度测试 (Streaming) ---
        ui.status.textContent = '正在进行带宽压力测试...';
        
        // 注意：这里建议指向服务器一个真实存在的大文件(如 /test.bin)，
        // 如果没有，测速将取决于你 index.html 的大小，依然不准。
        const testUrl = `${window.location.origin}/?cb=${Date.now()}`; 
        const response = await fetch(testUrl, { cache: 'no-store' });
        
        const reader = response.body.getReader();
        let receivedLength = 0;
        const startTime = performance.now();
        
        // 测速样本窗口（收集 3 秒钟的数据）
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            receivedLength += value.length;
            const elapsed = (performance.now() - startTime) / 1000;
            
            // 更新进度条 (30%-100%)
            const progress = Math.min(30 + (elapsed / 3) * 70, 100);
            ui.fill.style.width = `${progress}%`;

            // 实时显示大概速度
            const currentSpeed = formatMbps(receivedLength / elapsed);
            ui.download.textContent = currentSpeed;

            // 运行超过 3 秒就停止，防止消耗用户太多流量
            if (elapsed > 3) {
                await reader.cancel();
                break;
            }
        }

        ui.status.textContent = '测试完成！';
        ui.res.style.display = 'grid';
        document.getElementById('timestamp').textContent = '测速时间: ' + new Date().toLocaleString();

    } catch (err) {
        console.error(err);
        ui.status.textContent = '测试失败，请检查网络连接';
    } finally {
        testing = false;
        ui.btn.disabled = false;
        ui.btn.textContent = '重新测速';
        ui.progress.style.display = 'none';
    }
}
    </script>
  </body>
</html>
